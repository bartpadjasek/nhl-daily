# NHL Daily configuration
#
# Edit this file, commit it, and the GitHub Actions workflow picks it up.
# API keys and the recipient address are NOT set here: add them as GitHub
# secrets (see README). For local runs, put them in .env instead.

[team]
# Your team's three-letter abbreviation:
#   ANA BOS BUF CGY CAR CHI COL CBJ DAL DET EDM FLA LAK MIN MTL NSH
#   NJD NYI NYR OTT PHI PIT SJS SEA STL TBL TOR UTA VAN VGK WSH WPG
abbrev = "EDM"

[time]
# The clock that decides "last night", "tonight" and "tomorrow".
# Leave empty to use your team's home time zone.
local_timezone = ""
# Time zone for game start times shown in the email ("Tue 18 Nov, 19:00 MST").
# Leave empty to use local_timezone. Any IANA name works, e.g. "Europe/London".
display_timezone = ""

[llm]
# Which model writes the briefing, takeaways, subject line and fine print.
#   provider = "anthropic"          needs secret ANTHROPIC_API_KEY
#   provider = "openai"             needs secret OPENAI_API_KEY
#   provider = "gemini"             needs secret GEMINI_API_KEY
#   provider = "openai_compatible"  any OpenAI-style API (OpenRouter, Groq, Ollama,
#                                   LM Studio...): set base_url, and the key in
#                                   secret LLM_API_KEY (if the server needs one)
provider = "anthropic"
# Leave empty for the provider's default (see README). Examples:
#   anthropic: "claude-opus-5-5"   openai: "gpt-4.1"   gemini: "gemini-2.5-flash"
model = ""
# Only for openai_compatible, e.g. "https://openrouter.ai/api/v1" or
# "http://localhost:11434/v1" (Ollama).
base_url = ""

[email]
# Shown as the sender name and in the header. Empty = "<nickname> Daily",
# e.g. "Oilers Daily".
newsletter_name = ""
# Sender address. Resend's test address only delivers to your own Resend
# account email; use an address on a domain you've verified in Resend to send
# anywhere else.
from_address = "onboarding@resend.dev"
# Cards to leave out of the email. Any of:
#   next_up suffer_o_meter goal_log three_stars series_form season_5v5
#   what_we_learned on_this_day injuries standings playoff_race
#   team_leaders player_of_the_week prospects coming_up
hide_cards = []

[on_this_day]
# On This Day uses Wikipedia's "on this day" events. An event counts if it
# names your team in full (e.g. "Edmonton Oilers"), names one of these people,
# or uses your nickname alongside "NHL", "hockey" or "Stanley Cup".
# Add your franchise's legends here, e.g. ["Wayne Gretzky", "Mark Messier"].
people = []
